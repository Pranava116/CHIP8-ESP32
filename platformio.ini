[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200

lib_deps =
  bodmer/TFT_eSPI

build_flags =
  -D USER_SETUP_LOADED
  -D TFT_RGB_ORDER=TFT_RGB
  -D ILI9341_2_DRIVER
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MOSI=23
  -D TFT_SCLK=18
  -D TFT_CS=5
  -D TFT_DC=2
  -D TFT_RST=4

[env:native]
platform = native
build_flags =
  -std=c++11
  -static-libgcc
  -static-libstdc++
  -I SDL2/include
  -L SDL2/lib
  -lSDL2main
  -lSDL2